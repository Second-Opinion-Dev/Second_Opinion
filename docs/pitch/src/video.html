<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Second Opinion pitch video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#04090d;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Second Opinion pitch video. Every frame is a pure function of time:
   window.renderFrame(t) draws the picture at t seconds. Scene timing comes
   from timeline.py via window.setTiming. All data drawn here is synthetic. */
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const C = { bg: '#04090d', ink: '#e9eef0', mute: '#8fa1a8', acc: '#9fd8ea', flag: '#f0a35e', rule: '#f2d27a',
            panel: 'rgba(10,26,34,.82)', line: 'rgba(233,238,240,.16)' };
const F = { sans: '"Inter Tight","Segoe UI",sans-serif', serif: '"Instrument Serif",Georgia,serif',
            mono: '"JetBrains Mono",Consolas,monospace' };

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eb = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = (seed, i) => { const x = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453; return x - Math.floor(x); };
const vn = (seed, u) => { const i = Math.floor(u), f = u - i, s = f * f * (3 - 2 * f); return lerp(hash(seed, i), hash(seed, i + 1), s); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };

function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.a ?? 1;
  ctx.font = `${o.style || ''} ${o.weight || 400} ${o.size || 40}px ${o.family || F.sans}`.trim();
  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 30; }
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, o = {}) {
  ctx.save();
  ctx.font = `${o.style || ''} ${o.weight || 400} ${o.size || 40}px ${o.family || F.sans}`.trim();
  ctx.letterSpacing = (o.ls || 0) + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
/* fade-up text that starts at local time t0 */
function T(s, x, y, lt, t0, o = {}) {
  const p = eo(prog(lt, t0, t0 + .7));
  if (p <= 0) return;
  txt(s, x, y + (1 - p) * 26, { ...o, a: p * (o.a ?? 1) });
}
function pill(x, y, w, h, o = {}) {
  ctx.save();
  ctx.beginPath(); ctx.roundRect(x, y, w, h, o.r ?? h / 2);
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 2; ctx.stroke(); }
  ctx.restore();
}
function chip(label, cx, cy, o = {}) {
  const size = o.size || 24, w = measure(label, { family: F.mono, size, ls: 2 }) + 44, h = size + 28;
  pill(cx - w / 2, cy - h / 2, w, h, { fill: o.fill || 'rgba(159,216,234,.08)', stroke: o.stroke || 'rgba(159,216,234,.5)', lw: 2 });
  txt(label, cx, cy + size * .35, { family: F.mono, size, ls: 2, color: o.color || C.acc, align: 'center' });
}
function card(x, y, w, h, o = {}) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  pill(x, y, w, h, { fill: C.panel, r: o.r ?? 26 });
  ctx.restore();
  pill(x, y, w, h, { stroke: o.stroke || C.line, lw: 2, r: o.r ?? 26 });
}
function eyebrow(label, x, y, lt, t0, color = C.acc) { T(label, x, y, lt, t0, { family: F.mono, size: 24, ls: 7, color }); }
function headline(s, x, y, lt, t0, size = 76) { T(s, x, y, lt, t0, { weight: 600, size, ls: -2 }); }

/* ---------- background ---------- */
function drawBG(t, k = 1, spread = 0) {
  const g = ctx.createRadialGradient(lerp(1500, 960, spread), 420, 80, lerp(1150, 960, spread), 520, 1500);
  g.addColorStop(0, '#0b2230'); g.addColorStop(.5, '#06121a'); g.addColorStop(1, C.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.lineWidth = 2;
  for (let i = 0; i < 18; i++) {
    const bx = lerp(1380 + i * 28 + (i % 3) * 9, 90 + i * 96, spread);
    ctx.beginPath();
    for (let y = -20; y <= H + 20; y += 20) {
      const x = bx + Math.sin(y * .006 + t * .35 + i * 1.3) * 38 + Math.sin(y * .014 - t * .27 + i * .7) * 16;
      y === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = rgba(C.acc, (.03 + .06 * vn(i, t * .2)) * k);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- reusable drawings ---------- */
function sparkTile(x, y, w, h, seed, t, alpha, flagged) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  pill(x, y, w, h, { fill: 'rgba(10,26,34,.7)', stroke: 'rgba(159,216,234,.16)', lw: 1.5, r: 12 });
  ctx.beginPath();
  const n = 26;
  for (let i = 0; i < n; i++) {
    const u = i * .35 + t * 1.2 + seed * 7;
    const v = .5 + (vn(seed, u * .5) - .5) * .5 + (vn(seed + 3, u * 1.7) - .5) * .18;
    const px = x + 14 + (w - 28) * i / (n - 1), py = y + h - 16 - v * (h - 32);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.strokeStyle = C.acc; ctx.lineWidth = 2; ctx.globalAlpha *= .85; ctx.stroke();
  if (flagged) {
    ctx.globalAlpha = alpha; ctx.fillStyle = C.flag;
    ctx.beginPath(); ctx.arc(x + w - 18, y + 18, 5.5, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function tileGrid(cols, rows, tw, th, gap, cx, cy, scale, t, alphaFn, flagEvery) {
  const pw = (tw + gap) * scale, ph = (th + gap) * scale;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = cx + (c - (cols - 1) / 2) * pw - tw * scale / 2, y = cy + (r - (rows - 1) / 2) * ph - th * scale / 2;
    if (x > W || y > H || x + tw * scale < 0 || y + th * scale < 0) continue;
    const a = alphaFn(c, r); if (a <= 0) continue;
    ctx.save();
    ctx.translate(x, y); ctx.scale(scale, scale);
    sparkTile(0, 0, tw, th, r * 31 + c * 7 + 1, t, a, flagEvery && hash(r * 13 + 5, c * 17 + 2) < flagEvery);
    ctx.restore();
  }
}
function dashedLine(x1, y1, x2, y2, color, lw = 2, dash = [10, 10]) {
  ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function glowDot(x, y, r, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = color; ctx.shadowBlur = 28; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function pulseRing(x, y, lt, t0, color = C.flag, maxR = 70) {
  const p = prog(lt, t0, t0 + 1.4); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.strokeStyle = rgba(color, (1 - p) * .9); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(x, y, 14 + eo(p) * maxR, 0, 7); ctx.stroke(); ctx.restore();
}
function wordmark(x, y, size, a = 1, align = 'left') {
  const w1 = measure('SECOND', { weight: 700, size, ls: -size * .03 });
  const w2 = measure('opinion', { family: F.serif, style: 'italic', size: size * 1.08 });
  let sx = align === 'center' ? x - (w1 + size * .12 + w2) / 2 : x;
  txt('SECOND', sx, y, { weight: 700, size, ls: -size * .03, a });
  txt('opinion', sx + w1 + size * .12, y, { family: F.serif, style: 'italic', size: size * 1.08, color: C.acc, a });
}

/* ---------- scene 1: the scale ---------- */
function scene1(lt, dur) {
  drawBG(T_ABS, .8);
  const grid = () => tileGrid(9, 5, 180, 100, 22, 960, 540, 1, lt, (c, r) => {
    const d = Math.hypot(c - 4, (r - 2) * 1.6);
    return .42 * eo(prog(lt, .3 + d * .16, 1.2 + d * .16));
  }, .12);
  grid();
  const pl = ctx.createRadialGradient(960, 520, 100, 960, 520, 760);
  pl.addColorStop(0, 'rgba(4,9,13,.95)'); pl.addColorStop(.6, 'rgba(4,9,13,.82)'); pl.addColorStop(1, 'rgba(4,9,13,0)');
  ctx.fillStyle = pl; ctx.fillRect(0, 0, W, H);
  T('Thousands of measurements.', 960, 520, lt, 1.0, { weight: 600, size: 100, ls: -3, align: 'center' });
  T('Every single day.', 960, 650, lt, 2.2, { family: F.serif, style: 'italic', size: 118, color: C.acc, align: 'center' });
  const labels = [['Reports', 5.6], ['Decisions', 6.9], ['Water quality', 8.4]];
  const widths = labels.map(l => measure(l[0].toUpperCase(), { family: F.mono, size: 26, ls: 3 }) + 64);
  const total = widths.reduce((a, b) => a + b, 0) + 40 * 2;
  let x = 960 - total / 2;
  labels.forEach((l, i) => {
    const p = eb(prog(lt, l[1], l[1] + .6));
    if (p > 0) { ctx.save(); ctx.translate(x + widths[i] / 2, 850); ctx.scale(p, p); ctx.globalAlpha = clamp(p);
      chip(l[0].toUpperCase(), 0, 0, { size: 26 }); ctx.restore(); }
    x += widths[i] + 40;
  });
}

/* ---------- scene 2: the problem ---------- */
const S2D = (() => {
  const r = [];
  for (let i = 0; i < 120; i++) {
    let v = 50 + (vn(3, i * .35) - .5) * 14 + (vn(9, i * 1.7) - .5) * 6;
    if (i === 34) v = 77;
    if (i >= 56 && i <= 68) v = r[55];
    if (i >= 82 && i <= 84) v = 13;
    if (i >= 96) v += (i - 95) * 1.05;
    r.push(v);
  }
  return r;
})();
function scene2(lt, dur) {
  drawBG(T_ABS, .5);
  const X = i => 200 + i * (1520 / 119), Y = v => 880 - v / 100 * 520;
  eyebrow('THE PROBLEM', 200, 160, lt, .2, C.flag);
  headline('Fixed limits only see the edges.', 200, 250, lt, .4);
  // limit band
  const lp = eo(prog(lt, .7, 1.6));
  ctx.save(); ctx.globalAlpha *= lp;
  ctx.fillStyle = 'rgba(159,216,234,.035)'; ctx.fillRect(200, Y(90), 1520, Y(10) - Y(90));
  dashedLine(200, Y(90), 1720, Y(90), 'rgba(233,238,240,.55)', 2);
  dashedLine(200, Y(10), 1720, Y(10), 'rgba(233,238,240,.55)', 2);
  txt('UPPER LIMIT', 1720, Y(90) - 14, { family: F.mono, size: 18, ls: 3, color: C.mute, align: 'right' });
  txt('LOWER LIMIT', 1720, Y(10) + 30, { family: F.mono, size: 18, ls: 3, color: C.mute, align: 'right' });
  ctx.restore();
  // series sweep
  const f = eio(prog(lt, .9, 3.8)) * 119;
  ctx.save(); ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = '#cfe9f2';
  ctx.shadowColor = C.acc; ctx.shadowBlur = 14; ctx.beginPath();
  for (let i = 0; i <= Math.floor(f); i++) { i ? ctx.lineTo(X(i), Y(S2D[i])) : ctx.moveTo(X(i), Y(S2D[i])); }
  const fi = Math.floor(f), fr = f - fi;
  if (fi < 119) ctx.lineTo(lerp(X(fi), X(fi + 1), fr), lerp(Y(S2D[fi]), Y(S2D[fi + 1]), fr));
  ctx.stroke(); ctx.restore();
  // callouts, timed to the narration
  const marks = [
    { t0: 4.7, label: 'Spike', cx: X(34), cy: Y(77), ring: 'c', up: -78 },
    { t0: 9.8, label: 'Stuck meter', cx: X(62), cy: Y(S2D[55]), ring: 'r', w: X(68) - X(56) + 30, up: -80 },
    { t0: 11.0, label: 'Silent dropout', cx: X(83), cy: Y(13), ring: 'r', w: X(84) - X(82) + 50, up: -90 },
    { t0: 12.4, label: 'Slow drift', cx: X(108), cy: Y(63), ring: 'r', w: X(119) - X(96) + 30, h: 150, up: -120 },
  ];
  for (const m of marks) {
    const p = eb(prog(lt, m.t0, m.t0 + .55)); if (p <= 0) continue;
    ctx.save(); ctx.globalAlpha *= clamp(p);
    ctx.strokeStyle = C.flag; ctx.lineWidth = 3; ctx.shadowColor = C.flag; ctx.shadowBlur = 18;
    if (m.ring === 'c') { ctx.beginPath(); ctx.arc(m.cx, m.cy, 24 * p, 0, 7); ctx.stroke(); }
    else { const h = m.h || 76; ctx.beginPath(); ctx.roundRect(m.cx - m.w / 2, m.cy - h / 2, m.w, h, 14); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.globalAlpha *= clamp(p);
    const w = Math.max(measure(m.label, { weight: 600, size: 28 }), 190) + 40, y = m.cy + m.up;
    pill(m.cx - w / 2, y - 38, w, 76, { fill: 'rgba(10,26,34,.92)', stroke: 'rgba(240,163,94,.55)', lw: 2, r: 18 });
    txt(m.label, m.cx, y - 4, { weight: 600, size: 28, align: 'center' });
    txt('✓ inside the limits', m.cx, y + 24, { family: F.mono, size: 16, ls: 1, color: C.mute, align: 'center' });
    ctx.restore();
  }
  T('Inside the limits. Still unusual.', 960, 990, lt, 13.4, { family: F.serif, style: 'italic', size: 70, color: C.flag, align: 'center' });
}

/* ---------- scene 3: too many ---------- */
function scene3(lt, dur) {
  drawBG(T_ABS, .6);
  const sc = lerp(1.5, .5, eio(prog(lt, 0, 4.2)));
  tileGrid(26, 16, 180, 100, 22, 960, 540, sc, lt, (c, r) => .55 * eo(prog(lt, .0, .6)), .1);
  const pl = ctx.createRadialGradient(960, 540, 60, 960, 540, 640);
  pl.addColorStop(0, 'rgba(4,9,13,.96)'); pl.addColorStop(.65, 'rgba(4,9,13,.85)'); pl.addColorStop(1, 'rgba(4,9,13,0)');
  ctx.fillStyle = pl; ctx.fillRect(0, 0, W, H);
  T('Too many readings.', 960, 520, lt, .6, { weight: 600, size: 96, ls: -3, align: 'center' });
  T('Too little time.', 960, 640, lt, 2.7, { family: F.serif, style: 'italic', size: 112, color: C.flag, align: 'center' });
}

/* ---------- scene 4: the name ---------- */
function scene4(lt, dur) {
  drawBG(T_ABS, 1.7, eio(prog(lt, .5, 3)) * .5);
  T('THAT’S WHY WE BUILT', 960 + 4, 400, lt, .8, { family: F.mono, size: 26, ls: 8, color: C.acc, align: 'center' });
  const p = eo(prog(lt, 1.3, 2.3));
  if (p > 0) {
    ctx.save(); ctx.globalAlpha *= p; ctx.translate(960, 600); const s = lerp(.94, 1, p); ctx.scale(s, s);
    ctx.shadowColor = 'rgba(159,216,234,.35)'; ctx.shadowBlur = 60;
    wordmark(0, 0, 190, 1, 'center'); ctx.restore();
  }
  T('Spot the unusual. Decide what to check first.', 960, 730, lt, 2.4, { family: F.serif, style: 'italic', size: 52, color: C.ink, align: 'center', a: .9 });
}

/* ---------- scene 5: compare with own history ---------- */
const S5C = i => 50 + 8 * Math.sin(i * .06) + (vn(5, i * .05) - .5) * 10;
const S5D = (() => { const r = []; for (let i = 0; i < 100; i++) { let v = S5C(i) + (vn(7, i * 1.3) - .5) * 8 + (vn(8, i * 3.1) - .5) * 3; if (i === 78) v = S5C(i) + 27; r.push(v); } return r; })();
function scene5(lt, dur) {
  drawBG(T_ABS, .7);
  const X = i => 200 + i * (1520 / 99), Y = v => 880 - v / 100 * 480;
  eyebrow('01  COMPARE', 200, 160, lt, .2);
  headline('Judged against its own history.', 200, 250, lt, .4);
  const f = eio(prog(lt, 1.0, 5.4)) * 99, fi = Math.floor(f);
  const bandA = eo(prog(lt, .8, 1.6));
  // usual range band
  ctx.save(); ctx.globalAlpha *= bandA;
  ctx.beginPath(); for (let i = 0; i <= fi; i++) { const x = X(i), y = Y(S5C(i) + 12); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  for (let i = fi; i >= 0; i--) ctx.lineTo(X(i), Y(S5C(i) - 12));
  ctx.closePath(); ctx.fillStyle = 'rgba(159,216,234,.12)'; ctx.fill();
  for (const d of [12, -12]) { ctx.beginPath(); for (let i = 0; i <= fi; i++) { i ? ctx.lineTo(X(i), Y(S5C(i) + d)) : ctx.moveTo(X(i), Y(S5C(i) + d)); } ctx.strokeStyle = 'rgba(159,216,234,.35)'; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.setLineDash([12, 10]); ctx.beginPath(); for (let i = 0; i <= fi; i++) { i ? ctx.lineTo(X(i), Y(S5C(i))) : ctx.moveTo(X(i), Y(S5C(i))); } ctx.strokeStyle = 'rgba(159,216,234,.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  T('USUAL RANGE · FROM ITS OWN RECENT HISTORY', 210, 940, lt, 2.4, { family: F.mono, size: 20, ls: 3, color: C.acc });
  // reading line
  ctx.save(); ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = '#e1f2f8'; ctx.shadowColor = C.acc; ctx.shadowBlur = 12;
  ctx.beginPath(); for (let i = 0; i <= fi; i++) { i ? ctx.lineTo(X(i), Y(S5D[i])) : ctx.moveTo(X(i), Y(S5D[i])); }
  ctx.stroke(); ctx.restore();
  // flagged reading
  const pp = eb(prog(lt, 5.0, 5.6));
  if (pp > 0) {
    const px = X(78), py = Y(S5D[78]);
    glowDot(px, py, 12 * pp, C.flag);
    pulseRing(px, py, lt, 5.1); pulseRing(px, py, lt, 5.7);
    // reason card
    const ca = eo(prog(lt, 6.6, 7.3));
    if (ca > 0) {
      ctx.save(); ctx.globalAlpha *= ca; ctx.translate(0, (1 - ca) * 18);
      card(820, 330, 500, 130, { stroke: 'rgba(240,163,94,.55)', r: 22 });
      txt('WHY IT WAS FLAGGED', 852, 372, { family: F.mono, size: 18, ls: 4, color: C.flag });
      txt('Far above this sensor’s', 852, 414, { weight: 600, size: 30 });
      txt('usual range.', 852, 450, { weight: 600, size: 30 });
      ctx.beginPath(); ctx.moveTo(1320, 420); ctx.lineTo(px - 14, py - 10); ctx.strokeStyle = 'rgba(240,163,94,.6)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---------- scene 6: cases and ranking per plant ---------- */
const S6P = [
  { name: 'PLANT A', x: 150, rows: [
    { g: 'Ammonium', why: 'Stuck sensor', rule: true, len: 330, init: 1 },
    { g: 'Oxygen', why: 'Dropout to zero', rule: true, len: 220, init: 2 },
    { g: 'Influent volume', why: 'Far from its usual', rule: false, len: 120, init: 0 } ] },
  { name: 'PLANT B', x: 1000, rows: [
    { g: 'Nitrate', why: 'Dropout to zero', rule: true, len: 300, init: 2 },
    { g: 'Suspended solids', why: 'Far from its usual', rule: false, len: 210, init: 0 },
    { g: 'Temperature', why: 'Far from its usual', rule: false, len: 110, init: 1 } ] },
];
function scene6(lt, dur) {
  drawBG(T_ABS, .6);
  eyebrow('02  RANK', 150, 160, lt, .2);
  headline('Cases, ranked plant by plant.', 150, 250, lt, .4);
  const sort = eio(prog(lt, 3.7, 4.9)), pw = 770, ph = 580, py = 330;
  for (let pi = 0; pi < 2; pi++) {
    const P = S6P[pi], pa = eo(prog(lt, .3 + pi * .2, 1.0 + pi * .2));
    ctx.save(); ctx.globalAlpha *= pa;
    card(P.x, py, pw, ph, { r: 28 });
    txt(P.name, P.x + 40, py + 56, { family: F.mono, size: 22, ls: 6, color: C.acc });
    txt('OWN LIST · OWN OPERATOR', P.x + pw - 40, py + 56, { family: F.mono, size: 16, ls: 3, color: C.mute, align: 'right' });
    ctx.restore();
    P.rows.forEach((R, ri) => {
      const slot = lerp(R.init, ri, sort), ry = py + 92 + slot * 156;
      const ra = eo(prog(lt, .8 + pi * .2 + ri * .15, 1.4 + pi * .2 + ri * .15));
      ctx.save(); ctx.globalAlpha *= ra;
      const isTop = ri === 0, hl = isTop ? eo(prog(lt, 5.9, 6.6)) : 0;
      if (hl > 0) { pill(P.x + 18, ry - 10, pw - 36, 140, { fill: rgba(C.flag, .09 * hl), stroke: rgba(C.flag, .6 * hl), lw: 2, r: 20 }); }
      txt(R.g, P.x + 118, ry + 42, { weight: 600, size: 34 });
      txt(R.why.toUpperCase(), P.x + 118, ry + 82, { family: F.mono, size: 17, ls: 2, color: R.rule ? C.rule : C.mute });
      // track
      const tx = P.x + 410, tw = 320, cy = ry + 52;
      ctx.strokeStyle = 'rgba(233,238,240,.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(tx, cy); ctx.lineTo(tx + tw, cy); ctx.stroke();
      const len = R.len * .85, x0 = tx + 20, col = R.rule ? C.rule : C.flag;
      const merge = eio(prog(lt, 1.8, 3.2)), dots = eo(prog(lt, .9 + ri * .2, 1.5 + ri * .2));
      for (let k = 0; k < 5; k++) {
        const r = rng(pi * 100 + ri * 10 + k)();
        const ox = x0 + r * len, oy = (hash(pi + ri, k) - .5) * 40 * (1 - merge);
        glowDot(lerp(x0 + r * (len + 40) - 20, ox, merge), cy + oy, 6.5, col, dots * (1 - clamp(merge * 1.6 - .3)));
      }
      const capA = clamp((merge - .35) / .65);
      if (capA > 0) { ctx.save(); ctx.globalAlpha *= capA; ctx.shadowColor = col; ctx.shadowBlur = 16;
        pill(x0, cy - 12, len * merge, 24, { fill: col, r: 12 }); ctx.restore(); }
      // rank badge
      const ba = eb(prog(lt, 4.5 + ri * .15, 5.1 + ri * .15));
      if (ba > 0) { ctx.save(); ctx.translate(P.x + 62, ry + 56); ctx.scale(ba, ba);
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fillStyle = isTop ? C.flag : 'rgba(159,216,234,.12)'; ctx.fill();
        ctx.strokeStyle = isTop ? C.flag : 'rgba(159,216,234,.5)'; ctx.lineWidth = 2; ctx.stroke();
        txt(String(ri + 1), 0, 12, { weight: 700, size: 34, align: 'center', color: isTop ? '#1b1005' : C.ink }); ctx.restore(); }
      ctx.restore();
      if (isTop && hl > 0) { ctx.save(); ctx.globalAlpha *= hl; txt('CHECK FIRST', P.x + pw - 40, ry + 18, { family: F.mono, size: 17, ls: 4, color: C.flag, align: 'right' }); ctx.restore(); }
    });
  }
}

/* ---------- scene 7: isolation forest ---------- */
const S7PTS = (() => {
  const r = rng(11), pts = [];
  while (pts.length < 210) {
    const u = Math.sqrt(-2 * Math.log(r() + 1e-9)), a = 2 * Math.PI * r();
    if (u > 2.3) continue; // trim the tail so the cluster has a soft, round edge
    pts.push([700 + u * Math.cos(a) * 105, 590 + u * Math.sin(a) * 85, r()]);
  }
  return pts;
})();
const S7OUT = [[1085, 360], [285, 830], [1105, 805]];
function scene7(lt, dur) {
  drawBG(T_ABS, .7);
  eyebrow('03  SECOND VIEW', 200, 160, lt, .2);
  headline('A second, independent view.', 200, 250, lt, .4);
  const px = 200, py = 310, pw = 1000, ph = 600;
  const pa = eo(prog(lt, .4, 1.0));
  ctx.save(); ctx.globalAlpha *= pa; card(px, py, pw, ph, { r: 28 }); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 28); ctx.clip();
  S7PTS.forEach((p, i) => { const a = eo(prog(lt, .7 + p[2] * 1.4, 1.3 + p[2] * 1.4)); glowDot(p[0], p[1], 5.5 * a, C.acc, .75 * a); });
  S7OUT.forEach((p, i) => { const a = eo(prog(lt, 1.9 + i * .2, 2.4 + i * .2)); glowDot(p[0], p[1], 8 * a, '#d8eef5', a); });
  // random splits isolating the rare points
  const cuts = [
    { t: 2.7, v: true, at: 980, a: py, b: py + ph },
    { t: 3.2, v: false, at: 520, a: 980, b: px + pw },
    { t: 3.7, v: true, at: 520, a: py, b: py + ph },
    { t: 4.1, v: false, at: 700, a: px, b: 520 },
    { t: 4.5, v: false, at: 700, a: 980, b: px + pw },
  ];
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(159,216,234,.55)';
  for (const c of cuts) {
    const p = eo(prog(lt, c.t, c.t + .45)); if (p <= 0) continue;
    ctx.beginPath();
    if (c.v) { ctx.moveTo(c.at, c.a); ctx.lineTo(c.at, lerp(c.a, c.b, p)); } else { ctx.moveTo(c.a, c.at); ctx.lineTo(lerp(c.a, c.b, p), c.at); }
    ctx.stroke();
  }
  const ia = eo(prog(lt, 5.0, 5.8));
  if (ia > 0) {
    ctx.fillStyle = rgba(C.flag, .09 * ia);
    ctx.fillRect(980, py, px + pw - 980, 520 - py); ctx.fillRect(px, 700, 320, py + ph - 700); ctx.fillRect(980, 700, px + pw - 980, py + ph - 700);
    S7OUT.forEach(p => { glowDot(p[0], p[1], 10, C.flag, ia); });
  }
  ctx.restore();
  S7OUT.forEach((p, i) => { pulseRing(p[0], p[1], lt, 5.0 + i * .15, C.flag, 56); });
  T('Rare points are isolated in just a few cuts.', px + pw / 2, py + ph + 52, lt, 5.2, { family: F.mono, size: 20, ls: 2, color: C.mute, align: 'center' });
  // right column
  T('ISOLATION FOREST', 1300, 420, lt, 1.2, { family: F.mono, size: 24, ls: 6, color: C.acc });
  T('A different way', 1300, 510, lt, 1.6, { weight: 600, size: 52, ls: -1 });
  T('to spot what', 1300, 570, lt, 1.6, { weight: 600, size: 52, ls: -1 });
  T('doesn’t fit.', 1300, 635, lt, 1.6, { family: F.serif, style: 'italic', size: 66, color: C.acc });
  T('A second ranking, to compare.', 1300, 720, lt, 5.6, { size: 28, color: C.mute });
}

/* ---------- scene 8: transparent, operator decides ---------- */
function scene8(lt, dur) {
  drawBG(T_ABS, .7);
  const swap = (a, b, t0, t1) => eo(prog(lt, t0, t0 + .6)) * (1 - eo(prog(lt, t1, t1 + .5)));
  // left statements
  const l1 = swap(0, 0, .6, 6.7), l2 = swap(0, 0, 6.9, 9.3), l3 = eo(prog(lt, 9.5, 10.1));
  ctx.save(); ctx.globalAlpha = l1; txt('Transparent.', 150, 470, { weight: 600, size: 110, ls: -3 });
  txt('Every flag shows its evidence.', 150, 545, { family: F.serif, style: 'italic', size: 52, color: C.acc }); ctx.restore();
  ctx.save(); ctx.globalAlpha = l2;
  txt('A prompt to look.', 150, 440, { weight: 600, size: 92, ls: -3 });
  txt('Never a verdict.', 150, 545, { family: F.serif, style: 'italic', size: 104, color: C.flag }); ctx.restore();
  ctx.save(); ctx.globalAlpha = l3;
  txt('The operator', 150, 440, { weight: 600, size: 92, ls: -3 });
  txt('makes the call.', 150, 545, { family: F.serif, style: 'italic', size: 104, color: C.acc }); ctx.restore();
  // evidence card
  const ca = eo(prog(lt, .8, 1.5));
  ctx.save(); ctx.globalAlpha *= ca; ctx.translate(0, (1 - ca) * 20);
  const cx = 1000, cy = 190, cw = 770, ch = 640;
  card(cx, cy, cw, ch, { r: 28 });
  txt('FLAG · AMMONIUM · PLANT A', cx + 40, cy + 58, { family: F.mono, size: 20, ls: 4, color: C.flag });
  // mini chart
  const mx = cx + 40, my = cy + 90, mw = cw - 80, mh = 190;
  pill(mx, my, mw, mh, { fill: 'rgba(4,9,13,.5)', r: 16 });
  const mp = eo(prog(lt, 1.2, 2.6)), n = 60;
  ctx.save(); ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, 16); ctx.clip();
  const MX = i => mx + 20 + (mw - 40) * i / (n - 1), MY = v => my + mh - 24 - v * (mh - 48);
  ctx.fillStyle = 'rgba(159,216,234,.1)'; ctx.fillRect(mx, MY(.62), mw, MY(.38) - MY(.62));
  dashedLine(mx, MY(.5), mx + mw, MY(.5), 'rgba(159,216,234,.7)', 2, [10, 8]);
  ctx.beginPath(); const last = Math.floor((n - 1) * mp);
  for (let i = 0; i <= last; i++) { const v = i === 54 ? .93 : .5 + (vn(21, i * .6) - .5) * .22; i ? ctx.lineTo(MX(i), MY(v)) : ctx.moveTo(MX(i), MY(v)); }
  ctx.strokeStyle = '#e1f2f8'; ctx.lineWidth = 3; ctx.stroke();
  if (last >= 54) glowDot(MX(54), MY(.93), 9, C.flag);
  ctx.restore();
  // evidence rows
  const rows = [['VALUE', 'Above its usual range', 2.9], ['HISTORY', 'Median of its own recent days', 3.9], ['RULE', 'Which check fired, and why', 4.9], ['SOURCE', 'The exact file and row', 5.9]];
  rows.forEach((r, i) => {
    const a = eo(prog(lt, r[2], r[2] + .6)), y = cy + 340 + i * 72;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate((1 - a) * 30, 0);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx + 40, y - 40); ctx.lineTo(cx + cw - 40, y - 40); ctx.stroke();
    txt(r[0], cx + 40, y, { family: F.mono, size: 19, ls: 4, color: C.acc });
    txt(r[1], cx + 220, y + 2, { weight: 500, size: 28 });
    ctx.restore();
  });
  ctx.restore();
  // operator decision
  const ba = eo(prog(lt, 9.6, 10.2));
  if (ba > 0) {
    ctx.save(); ctx.globalAlpha *= ba;
    const bx = 150, by = 640, press = eo(prog(lt, 10.9, 11.1));
    pill(bx, by, 300, 88, { fill: press > 0 ? rgba(C.acc, .95) : 'rgba(159,216,234,.1)', stroke: C.acc, lw: 2.5 });
    txt(press > 0 ? '✓  Investigate' : 'Investigate', bx + 150, by + 56, { weight: 600, size: 34, align: 'center', color: press > 0 ? '#06222d' : C.acc });
    pill(bx + 330, by, 220, 88, { stroke: 'rgba(233,238,240,.35)', lw: 2 });
    txt('Dismiss', bx + 440, by + 56, { weight: 500, size: 34, align: 'center', color: C.mute });
    // cursor
    const cp = eio(prog(lt, 10.0, 10.9));
    const cxp = lerp(bx + 520, bx + 210, cp), cyp = lerp(by + 150, by + 62, cp), sc = 1 - .12 * (prog(lt, 10.9, 11.0) - prog(lt, 11.0, 11.2));
    ctx.translate(cxp, cyp); ctx.scale(sc, sc);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(9, 26); ctx.lineTo(16, 40); ctx.lineTo(23, 37); ctx.lineTo(16, 24); ctx.lineTo(27, 24); ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#04090d'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

/* ---------- scene 9: close ---------- */
function scene9(lt, dur) {
  drawBG(T_ABS, 2, eio(prog(lt, 0, 2.5)));
  const p = eo(prog(lt, .5, 1.5));
  if (p > 0) { ctx.save(); ctx.globalAlpha *= p; ctx.translate(960, 440); const s = lerp(.95, 1, p); ctx.scale(s, s);
    ctx.shadowColor = 'rgba(159,216,234,.35)'; ctx.shadowBlur = 60; wordmark(0, 0, 170, 1, 'center'); ctx.restore(); }
  T('Attention where it matters most.', 960, 590, lt, 3.4, { family: F.serif, style: 'italic', size: 76, align: 'center' });
  const ca = eo(prog(lt, 4.6, 5.3));
  if (ca > 0) { ctx.save(); ctx.globalAlpha *= ca; chip('BUILT AROUND TAI’S Z-INFO PLATFORM', 960, 720, { size: 24 }); ctx.restore(); }
  T('RESEARCH PROTOTYPE  ·  JOSHUA VARGHESE THOMJI  ·  SUNIL PARAMESWARAN  ·  SMRITI SRIDHAR  ·  OINDRILLA BANERJEE', 960, 985, lt, 5.6, { family: F.mono, size: 17, ls: 2.5, color: C.mute, align: 'center' });
}

/* ---------- driver ---------- */
const SCENES = { s1: scene1, s2: scene2, s3: scene3, s4: scene4, s5: scene5, s6: scene6, s7: scene7, s8: scene8, s9: scene9 };
let TIM = null, T_ABS = 0;
window.setTiming = t => { TIM = t; };
window.loadFonts = async () => {
  await Promise.all(['600 40px "Inter Tight"', '700 40px "Inter Tight"', '500 40px "Inter Tight"', 'italic 40px "Instrument Serif"', '400 20px "JetBrains Mono"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
};
window.renderFrame = t => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const sc = TIM.scenes.find(s => t >= s.start && t < s.end) || TIM.scenes[TIM.scenes.length - 1];
  const lt = t - sc.start, dur = sc.end - sc.start; T_ABS = t;
  const last = sc === TIM.scenes[TIM.scenes.length - 1];
  const fadeIn = eo(prog(lt, 0, .45)), fadeOut = last ? 1 - eo(prog(lt, dur - 1.0, dur)) : 1 - eo(prog(lt, dur - .4, dur));
  ctx.save();
  ctx.globalAlpha = Math.min(fadeIn, fadeOut);
  const z = 1 + .02 * prog(lt, 0, dur);
  ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-960, -540);
  SCENES[sc.id](lt, dur);
  ctx.restore();
};
